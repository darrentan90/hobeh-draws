# Publish new 4D and TOTO results without anything of mine being switched on.
#
# This is the whole point of the job: the app reads latest.json straight from
# this repo, so once GitHub is the thing that writes it, neither the Mac nor
# the pieface is on the path between a draw being published and a phone seeing
# it. The pieface still writes the Obsidian vault on its own timers; that is
# now a separate concern that can be down for a week without the app noticing.
#
# COST TO SINGAPORE POOLS
# A run with no new draw fetches two small pre-rendered fragments — the same
# files their own site's JavaScript polls — and stops. Only a run that finds a
# genuinely new draw number opens a result page, one per draw, 1.5s apart.
# See the header of build_latest.py.

name: Update draws

on:
  schedule:
    # Times are UTC; Singapore is UTC+8. Every five minutes from 6.30pm to
    # 10pm SGT, and not at all for the other twenty hours.
    #
    # Five minutes is the floor GitHub allows, and it is only affordable
    # because of the due-today check in build_latest.py: once a game's draw
    # for the day has been collected, every remaining run answers "nothing
    # due" and exits in a tenth of a second without opening a connection. On
    # a night with no draw, that is every run. So the frequency buys latency
    # on the one run that matters and costs Singapore Pools nothing on the
    # rest.
    #
    # GitHub's scheduler is best-effort and is routinely late under load, so
    # treat this as "within about five to fifteen minutes", not a guarantee.
    - cron: "30-55/5 10 * * *"   # 6.30pm - 6.55pm SGT
    - cron: "*/5 11-13 * * *"    # 7pm - 9.55pm SGT
    - cron: "0 14 * * *"         # 10pm SGT
  # So a missed draw can be picked up by hand without waiting for the next slot.
  workflow_dispatch:

# GitHub's scheduler can fire minutes late under load and will happily start a
# second run while the first is still going. Two runs committing the same file
# is a push race, so they queue instead.
concurrency:
  group: update-draws
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # The parser is a vendored copy of the pieface updater's. If someone
      # edits one and not the other, fail here rather than publish whatever
      # the drifted copy happens to produce.
      - name: Check the vendored scraper
        run: python build_latest.py --check-scraper

      - name: Scrape and rebuild latest.json
        run: python build_latest.py

      # `build_latest.py` leaves the file untouched when nothing changed, so an
      # empty diff is the normal outcome and must not fail or commit.
      - name: Commit if anything changed
        run: |
          set -euo pipefail
          if git diff --quiet -- latest.json; then
            echo "no change to publish"
            exit 0
          fi
          SUMMARY=$(python summarise.py)
          git config user.name  "hobeh-draws bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add latest.json
          git commit -m "$SUMMARY"
          # Rebase rather than force: a concurrent run may have landed first,
          # and its draws are as real as this run's.
          git pull --rebase --autostash origin main
          git push
