# Publish new 4D and TOTO results without anything of mine being switched on.
#
# This is the whole point of the job: the app reads latest.json straight from
# this repo, so once GitHub is the thing that writes it, neither the Mac nor
# the pieface is on the path between a draw being published and a phone seeing
# it. The pieface still writes the Obsidian vault on its own timers; that is
# now a separate concern that can be down for a week without the app noticing.
#
# COST TO SINGAPORE POOLS
# A run with no new draw fetches two small pre-rendered fragments — the same
# files their own site's JavaScript polls — and stops. Only a run that finds a
# genuinely new draw number opens a result page, one per draw, 1.5s apart.
# See the header of build_latest.py.

name: Update draws

on:
  schedule:
    # Times are UTC; Singapore is UTC+8. Every ten minutes from 6.30pm to 10pm
    # SGT — when a result can actually appear — plus four cheap catch-up runs
    # spread through the following twelve hours.
    #
    # Polling this often is only affordable because of the due-today check in
    # build_latest.py: once a game's draw for the day has been collected AND
    # (for TOTO) its prize table has landed, every remaining run answers
    # "nothing due" and exits in a tenth of a second without opening a
    # connection. On a night with no draw, that is every run. So the frequency
    # buys latency on the one run that matters and costs Singapore Pools
    # nothing on the rest.
    #
    # GitHub's scheduler is best-effort. It is not merely "late under load" —
    # IT DROPS RUNS, and it drops whole days. Measured on this repo: the
    # */5 schedule below asked for about forty firings across the evening
    # window and got six on 25 Aug, six on 26 Aug, and **none at all** on
    # 27 Aug, when a TOTO draw was made. Nothing was disabled, nothing failed;
    # the runs were simply never created. That is the single reason a draw the
    # scraper could see never reached a phone.
    #
    # Two changes follow from that, and they are different in kind:
    #
    #   1. The evening polls are every ten minutes rather than every five.
    #      Dense schedules are the ones GitHub sheds first, and five minutes
    #      was buying latency the scheduler was never delivering anyway — it
    #      honoured roughly one firing in seven. Ten minutes asks for half as
    #      much and is far likelier to be granted, which makes the *expected*
    #      delay shorter, not longer.
    #
    #   2. THE CATCH-UPS BELOW ARE THE ACTUAL FIX. Every run in the evening
    #      window can be dropped and the draw still gets published, because
    #      the day does not end at 10pm any more: the job looks again at
    #      midnight, at 4am, at 9am and at noon. `due_games` makes each of
    #      those free when there is nothing outstanding — it exits without
    #      opening a connection — so the whole safety net costs four no-op
    #      runs a day and turns "the result never arrived" into "the result
    #      arrived by morning at the very worst".
    #
    # Treat the evening window as "within about ten to thirty minutes", and
    # the catch-ups as the guarantee.
    - cron: "30,40,50 10 * * *"        # 6.30pm - 6.50pm SGT
    - cron: "0,10,20,30,40,50 11-13 * * *"  # 7pm - 9.50pm SGT
    - cron: "0 14 * * *"               # 10pm SGT
    # Catch-ups, for an evening the scheduler dropped on the floor. Free on any
    # day where the evening worked: `due_games` answers "nothing due" and the
    # run ends in a tenth of a second having asked Singapore Pools nothing.
    - cron: "0 16 * * *"               # midnight SGT
    - cron: "0 20 * * *"               # 4am SGT
    - cron: "0 1 * * *"                # 9am SGT
    - cron: "0 4 * * *"                # noon SGT
  # So a missed draw can be picked up by hand without waiting for the next
  # slot. With the scheduler behaving the way it does, this is a normal tool
  # rather than an emergency one: Actions → Update draws → Run workflow.
  workflow_dispatch:

# GitHub's scheduler can fire minutes late under load and will happily start a
# second run while the first is still going. Two runs committing the same file
# is a push race, so they queue instead.
concurrency:
  group: update-draws
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # The parser is a vendored copy of the pieface updater's. If someone
      # edits one and not the other, fail here rather than publish whatever
      # the drifted copy happens to produce.
      - name: Check the vendored scraper
        run: python build_latest.py --check-scraper

      - name: Scrape and rebuild latest.json
        run: python build_latest.py

      # `build_latest.py` leaves the file untouched when nothing changed, so an
      # empty diff is the normal outcome and must not fail or commit.
      - name: Commit if anything changed
        run: |
          set -euo pipefail
          if git diff --quiet -- latest.json; then
            echo "no change to publish"
            exit 0
          fi
          SUMMARY=$(python summarise.py)
          git config user.name  "hobeh-draws bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add latest.json
          git commit -m "$SUMMARY"
          # Rebase rather than force: a concurrent run may have landed first,
          # and its draws are as real as this run's.
          git pull --rebase --autostash origin main
          git push
