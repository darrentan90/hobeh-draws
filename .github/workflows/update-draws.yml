# Publish new 4D and TOTO results without anything of mine being switched on.
#
# This is the whole point of the job: the app reads latest.json straight from
# this repo, so once GitHub is the thing that writes it, neither the Mac nor
# the pieface is on the path between a draw being published and a phone seeing
# it. The pieface still writes the Obsidian vault on its own timers; that is
# now a separate concern that can be down for a week without the app noticing.
#
# COST TO SINGAPORE POOLS
# A look with no new draw fetches two small pre-rendered fragments — the same
# files their own site's JavaScript polls — and stops. Only a look that finds a
# genuinely new draw number opens a result page, one per draw, 1.5s apart.
# See the header of build_latest.py.

name: Update draws

on:
  schedule:
    # Times are UTC; Singapore is UTC+8.
    #
    # GITHUB'S SCHEDULER IS NOT A CLOCK. It is not merely "late under load" —
    # it drops runs, and it drops whole evenings. Measured on this repo in the
    # week to 4 Sep 2026: twenty-two entries between 6.30pm and 10pm SGT
    # produced NO runs at all, on any evening. The first run each evening was
    # the "10pm" entry, created at about 10.40pm, and that is what published
    # Thursday's TOTO result four hours late. Nothing was disabled and nothing
    # failed; the runs were simply never created.
    #
    # So the schedule no longer decides WHEN the scrape happens. Every run is
    # `build_latest.py --watch`: it sleeps until 6.28pm SGT, then looks every
    # ninety seconds until today's draws have all landed, pushing each one the
    # moment it does, and hands over to a fresh run if its six hours would end
    # before the draw. All the schedule has to do is get ONE run started at
    # some point in the afternoon — which, measured, it does: the noon entry
    # has turned up between 1pm and 5.30pm every day. Several afternoon
    # entries follow, so that even a mostly-dropped day starts a watcher. On a
    # day with no draw every one of them exits in a tenth of a second without
    # opening a connection, because `due_games` says so.
    #
    # `concurrency` below keeps this to one live watcher: a second run created
    # while one is sleeping through the afternoon waits in the queue and, when
    # its turn comes, finds nothing due and exits.
    - cron: "0 7 * * *"                # 3pm SGT — afternoon starters
    - cron: "0 8 * * *"                # 4pm
    - cron: "0 9 * * *"                # 5pm
    - cron: "30 9 * * *"               # 5.30pm
    - cron: "0 10 * * *"               # 6pm
    - cron: "15 10 * * *"              # 6.15pm
    - cron: "30,45 10 * * *"           # 6.30pm, 6.45pm — evening fallbacks
    - cron: "0,30 11-13 * * *"         # 7pm - 9.30pm
    - cron: "0 14 * * *"               # 10pm
    # Catch-ups, for a whole day the scheduler dropped on the floor. Free on
    # any day where the evening worked: `due_games` answers "nothing due" and
    # the run ends without asking Singapore Pools anything.
    - cron: "0 16 * * *"               # midnight SGT
    - cron: "0 20 * * *"               # 4am
    - cron: "0 1 * * *"                # 9am
    - cron: "0 4 * * *"                # noon
  # So a missed draw can be picked up by hand without waiting for the next
  # slot, and how a watcher hands over to its successor when its six hours
  # run out before the draw is in: Actions → Update draws → Run workflow.
  workflow_dispatch:

# One watcher at a time. A run created while another is live queues behind it
# rather than racing it to the push; GitHub keeps one queued run per group and
# replaces it with any newer one, which is exactly right here — every run is
# the same watcher.
concurrency:
  group: update-draws
  cancel-in-progress: false

permissions:
  contents: write
  # For `gh workflow run`: a watcher whose budget ends before the draw has
  # landed starts its own successor.
  actions: write

jobs:
  update:
    runs-on: ubuntu-latest
    # GitHub kills a job at six hours. `build_latest.py` budgets 5h35m for
    # itself and hands over before that; this is the backstop.
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # The parser is a vendored copy of the pieface updater's. If someone
      # edits one and not the other, fail here rather than publish whatever
      # the drifted copy happens to produce.
      - name: Check the vendored scraper
        run: python build_latest.py --check-scraper

      # Sleeps until the draw, looks every ninety seconds until the day's
      # results are in, and runs publish.sh after every write — so a 4D result
      # is on phones while the TOTO prize table is still being waited for.
      - name: Watch for today's draws and publish each as it lands
        env:
          HOBEH_PUBLISH: "1"
          GH_TOKEN: ${{ github.token }}
          PYTHONUNBUFFERED: "1"
        run: python build_latest.py --watch

      # Belt and braces: a push that failed inside the watch (a rebase that
      # could not be resolved, a network blip on the runner) is retried here.
      # No change is the normal outcome and does nothing.
      - name: Publish anything still unpushed
        run: bash publish.sh
